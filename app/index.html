<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Frame</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="shell">

  <!-- CALENDAR VIEW -->
  <section id="calendar-view">
    <header class="top">
      <div>
        <p class="eyebrow">Daily Frame</p>
        <h1 id="month-label">Month</h1>
      </div>
      <div class="nav">
        <button id="prev-month" class="icon-btn" aria-label="Previous month">&#8249;</button>
        <button id="today-btn" class="text-btn">Today</button>
        <button id="next-month" class="icon-btn" aria-label="Next month">&#8250;</button>
      </div>
    </header>

    <p id="month-summary" class="summary"></p>

    <div class="weekdays">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div id="grid" class="grid"></div>

    <p class="footnote">Just for you. No likes, no followers. Everything stays on this device.</p>
  </section>

  <!-- DAY VIEW -->
  <section id="day-view" hidden>
    <header class="top">
      <button id="back-btn" class="text-btn">&#8249; Calendar</button>
      <div class="nav">
        <button id="prev-day" class="icon-btn" aria-label="Previous day">&#8249;</button>
        <button id="next-day" class="icon-btn" aria-label="Next day">&#8250;</button>
      </div>
    </header>

    <h2 id="day-label">Day</h2>

    <div id="photo-wrap" class="photo-wrap">
      <img id="photo" alt="Photo for this day" hidden />
      <label id="photo-empty" class="photo-empty">
        <span class="plus">+</span>
        <span>Add a photo for this day</span>
        <span class="hint">Any photo. It does not have to be a good one.</span>
        <input id="photo-input" type="file" accept="image/*" capture="environment" />
      </label>
    </div>

    <div class="photo-actions" id="photo-actions" hidden>
      <label class="text-btn">Replace photo
        <input id="replace-input" type="file" accept="image/*" />
      </label>
      <button id="delete-btn" class="text-btn danger">Delete day</button>
    </div>

    <label for="reflection" class="reflection-label">Reflection</label>
    <textarea id="reflection" rows="7" placeholder="What happened today? How did it feel? Write it for yourself, not an audience."></textarea>
    <p id="save-status" class="save-status"></p>
  </section>

</main>
<script src="app.js"></script>
</body>
</html>
